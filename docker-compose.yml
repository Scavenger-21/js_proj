version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: apiforge-postgres
    environment:
      POSTGRES_USER: apiforge
      POSTGRES_PASSWORD: apiforge
      POSTGRES_DB: apiforge
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U apiforge']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
